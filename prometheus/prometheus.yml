global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fintwin-fastapi'
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - fintwin-prod
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: fintwin-backend-svc
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
    metrics_path: '/metrics'
