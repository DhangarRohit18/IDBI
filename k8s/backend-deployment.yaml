apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintwin-backend
  namespace: fintwin-prod
  labels:
    app: fintwin-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fintwin-backend
  template:
    metadata:
      labels:
        app: fintwin-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/your-org/fintwin-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: fintwin-config
        - secretRef:
            name: fintwin-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fintwin-backend-hpa
  namespace: fintwin-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fintwin-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
