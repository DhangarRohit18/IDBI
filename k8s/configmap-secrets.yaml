apiVersion: v1
kind: ConfigMap
metadata:
  name: fintwin-config
  namespace: fintwin-prod
data:
  APP_ENV: "production"
  DATABASE_POOL_SIZE: "20"
  REDIS_URL: "redis://redis.fintwin-prod.svc.cluster.local:6379/0"
  QDRANT_HOST: "qdrant.fintwin-prod.svc.cluster.local"
  QDRANT_PORT: "6333"
  NEXT_PUBLIC_API_URL: "https://api.fintwin.ai/api/v1"
  NEXT_PUBLIC_WS_URL: "wss://api.fintwin.ai/api/v1/ws"
---
apiVersion: v1
kind: Secret
metadata:
  name: fintwin-secrets
  namespace: fintwin-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://fintwin_app:PRODUCTION_DB_PASSWORD@postgres.fintwin-prod.svc.cluster.local:5432/fintwin_db"
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_SECRET_KEY_123"
  ENCRYPTION_KEY: "CHANGE_ME_IN_PRODUCTION_ENCRYPTION_KEY_123"
  GEMINI_API_KEY: "CHANGE_ME_IN_PRODUCTION_GEMINI_KEY"
  GSTN_API_KEY: "CHANGE_ME_IN_PRODUCTION_GSTN_KEY"
