apiVersion: v1
kind: Service
metadata:
  name: fintwin-backend-svc
  namespace: fintwin-prod
spec:
  selector:
    app: fintwin-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: fintwin-frontend-svc
  namespace: fintwin-prod
spec:
  selector:
    app: fintwin-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fintwin-ingress
  namespace: fintwin-prod
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - fintwin.ai
    - api.fintwin.ai
    secretName: fintwin-tls-secret
  rules:
  - host: fintwin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fintwin-frontend-svc
            port:
              number: 80
  - host: api.fintwin.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fintwin-backend-svc
            port:
              number: 8000
