version: '3.9'

networks:
  fintwin_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  storage_data:
  model_data:

services:
  # ============================================================
  # DATABASE SERVICES
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: fintwin_postgres
    environment:
      POSTGRES_DB: fintwin_db
      POSTGRES_USER: fintwin_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintwin_secure_pass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/db/migrations/versions/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    ports:
      - "5432:5432"
    networks:
      - fintwin_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintwin_app -d fintwin_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fintwin_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - fintwin_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: fintwin_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - fintwin_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ============================================================
  # BACKEND API SERVICE
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintwin_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fintwin_app:${POSTGRES_PASSWORD:-fintwin_secure_pass}@postgres:5432/fintwin_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      REDIS_CACHE_DB: 1
      REDIS_SESSION_DB: 2
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/4
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - storage_data:/app/storage
      - model_data:/app/ai_modules/data/trained_models
    ports:
      - "8000:8000"
    networks:
      - fintwin_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================
  # CELERY WORKERS
  # ============================================================
  celery_ml:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintwin_celery_ml
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ml_queue,digital_twin_queue --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fintwin_app:${POSTGRES_PASSWORD:-fintwin_secure_pass}@postgres:5432/fintwin_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/4
      QDRANT_HOST: qdrant
    volumes:
      - storage_data:/app/storage
      - model_data:/app/ai_modules/data/trained_models
    networks:
      - fintwin_network
    depends_on:
      - postgres
      - redis
      - qdrant
    restart: unless-stopped

  celery_ews:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintwin_celery_ews
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q ews_queue,notification_queue --concurrency=4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fintwin_app:${POSTGRES_PASSWORD:-fintwin_secure_pass}@postgres:5432/fintwin_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/4
    networks:
      - fintwin_network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintwin_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler redbeat.RedBeatScheduler
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/3
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/4
    networks:
      - fintwin_network
    depends_on:
      - redis
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fintwin_flower
    command: celery -A app.tasks.celery_app flower --port=5555
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/3
    ports:
      - "5555:5555"
    networks:
      - fintwin_network
    depends_on:
      - redis
    restart: unless-stopped

  # ============================================================
  # FRONTEND SERVICE
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fintwin_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_WS_URL: ws://backend:8000
    ports:
      - "3000:3000"
    networks:
      - fintwin_network
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================================
  # NGINX REVERSE PROXY
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: fintwin_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - fintwin_network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
